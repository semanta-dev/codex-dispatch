name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: cross-compile (native Windows/macOS have no runnable tests here)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt issues:"
            echo "$out"
            exit 1
          fi
      - name: go test (race detector)
        run: go test -race ./...
      - name: go test (race stressors — concurrency-heavy packages)
        run: go test -race -count=20 ./internal/broker/ ./internal/codex/appserver/
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: install native shell test dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            brew install bash
            echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
          fi
          git clone --depth 1 --branch v1.12.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          echo "$RUNNER_TEMP/bats-core/bin" >> "$GITHUB_PATH"
      - name: provision unprivileged Windows ACL test principal
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $aclPassword = [guid]::NewGuid().ToString('N') + 'aA1!'
          Write-Output "::add-mask::$aclPassword"
          New-LocalUser -Name CodexAclProbe -Password (ConvertTo-SecureString $aclPassword -AsPlainText -Force) -AccountNeverExpires
          Add-LocalGroupMember -Group Users -Member CodexAclProbe
          "CODEX_ACL_TEST_USER=CodexAclProbe" >> $env:GITHUB_ENV
          "CODEX_ACL_TEST_PASSWORD=$aclPassword" >> $env:GITHUB_ENV
      - name: native Go tests
        shell: bash
        run: go test -json ./... > native-tests.jsonl
      - name: remove ACL test principal
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-LocalUser -Name CodexAclProbe -ErrorAction SilentlyContinue
      - name: native artifact build and launch
        shell: bash
        run: |
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          go build -o "codex-dispatch$suffix" ./cmd/codex-dispatch
          "./codex-dispatch$suffix" --version
      - name: native shell and failure-injection gates
        shell: bash
        run: |
          bash --version
          suffix=""
          if [ "$RUNNER_OS" = Windows ]; then suffix=.exe; fi
          export CODEX_DISPATCH_BIN="$PWD/codex-dispatch$suffix"
          export MSYS=winsymlinks:nativestrict
          bats --print-output-on-failure tests/bats/dispatch-codex.bats tests/bats/dispatch-detach.bats tests/bats/clean-verify.bats tests/bats/graphrag-scope-audit.bats tests/bats/graphrag-worktree-dispatch.bats tests/bats/graphrag-plan-runner.bats > native-shell.tap
          python3 -m unittest discover -s tests/python > native-python.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: |
            native-tests.jsonl
            native-shell.tap
            native-python.txt

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/hooks/*.sh tests/bats/helpers/setup.bash
      - name: jq validate plugin manifest
        run: jq -e . .claude-plugin/plugin.json >/dev/null
      - name: jq validate hooks manifest
        run: jq -e . .claude-plugin/hooks/hooks.json >/dev/null

  snapshot-and-bats:
    runs-on: ubuntu-latest
    needs: [go, shell, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target
      - name: locate snapshot binary
        id: bin
        run: |
          path=$(find dist -type f -name codex-dispatch -perm -u+x | head -n 1)
          if [ -z "$path" ]; then
            echo "snapshot binary not found"; exit 1
          fi
          echo "path=$(pwd)/$path" >>"$GITHUB_OUTPUT"
      - name: install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
      - name: run bats against snapshot binary
        env:
          CODEX_DISPATCH_BIN: ${{ steps.bin.outputs.path }}
        run: |
          bats tests/bats/dispatch-codex.bats
          bats tests/bats/dispatch-gowork-cwd.bats
          bats tests/bats/pick-iterations.bats
          bats tests/bats/launcher.bats
          bats tests/bats/dispatch-detach.bats
          bats tests/bats/hooks.bats
          bats tests/bats/reviewer-harness.bats
          bats tests/bats/clean-verify.bats
          bats tests/bats/graphrag-scope-audit.bats
          bats tests/bats/graphrag-worktree-dispatch.bats
      - name: fan-in rollback tests
        run: python3 -m unittest discover -s tests/python
      - name: run plan-runner bats
        run: bats tests/bats/graphrag-plan-runner.bats

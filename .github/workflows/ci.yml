name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: cross-compile (native Windows/macOS have no runnable tests here)
        run: |
          GOOS=windows GOARCH=amd64 go build ./...
          GOOS=windows GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=arm64 go build ./...
          GOOS=darwin GOARCH=amd64 go build ./...
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt issues:"
            echo "$out"
            exit 1
          fi
      - name: go test (race detector)
        run: go test -race ./...
      - name: go test (race stressors — concurrency-heavy packages)
        run: go test -race -count=20 ./internal/broker/ ./internal/codex/appserver/
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0

  # Native execution is Linux-only: the sandbox (bubblewrap) and the process
  # ownership model have no macOS or Windows equivalent, so those legs only
  # exercised unsupported paths. Windows and macOS portability stays covered by
  # the cross-compile step in the `go` job.
  native:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: install native shell test dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
          bash scripts/ci-configure-bwrap.sh | tee "$RUNNER_TEMP/native-evidence/bwrap-prerequisite.txt"
          git clone --depth 1 --branch v1.12.0 https://github.com/bats-core/bats-core.git "$RUNNER_TEMP/bats-core"
          echo "$RUNNER_TEMP/bats-core/bin" >> "$GITHUB_PATH"
      - name: native Go tests
        shell: bash
        run: go test -json ./... > "$RUNNER_TEMP/native-evidence/native-tests.jsonl"
      - name: native artifact build and launch
        shell: bash
        run: |
          go build -o "$RUNNER_TEMP/codex-dispatch" ./cmd/codex-dispatch
          "$RUNNER_TEMP/codex-dispatch" --version
      - name: native shell and failure-injection gates
        shell: bash
        run: |
          bash --version
          export CODEX_DISPATCH_BIN="$RUNNER_TEMP/codex-dispatch"
          bats --print-output-on-failure tests/bats/launcher.bats tests/bats/dispatch-codex.bats tests/bats/dispatch-detach.bats tests/bats/clean-verify.bats tests/bats/graphrag-scope-audit.bats tests/bats/graphrag-worktree-dispatch.bats tests/bats/graphrag-plan-runner.bats > "$RUNNER_TEMP/native-evidence/native-shell.tap"
          python3 -m unittest discover -s tests/python > "$RUNNER_TEMP/native-evidence/native-python.txt" 2>&1
      - name: Adversarial remediation regression gates
        if: always()
        shell: bash
        run: python3 scripts/remediation-gates.py --out "$RUNNER_TEMP/native-evidence/remediation"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/native-evidence/

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/*.sh scripts/hooks/*.sh tests/bats/helpers/setup.bash
      - name: jq validate plugin manifest
        run: jq -e . .claude-plugin/plugin.json >/dev/null
      - name: jq validate hooks manifest
        run: jq -e . .claude-plugin/hooks/hooks.json >/dev/null

  snapshot-and-bats:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [go, shell, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean --single-target
      - name: locate snapshot binary
        id: bin
        run: |
          path=$(find dist -type f -name codex-dispatch -perm -u+x | head -n 1)
          if [ -z "$path" ]; then
            echo "snapshot binary not found"; exit 1
          fi
          echo "path=$(pwd)/$path" >>"$GITHUB_OUTPUT"
      - name: install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats bubblewrap ripgrep
          bash scripts/ci-configure-bwrap.sh
      - name: run bats against snapshot binary
        env:
          CODEX_DISPATCH_BIN: ${{ steps.bin.outputs.path }}
        run: |
          bats tests/bats/dispatch-codex.bats
          bats tests/bats/dispatch-gowork-cwd.bats
          bats tests/bats/pick-iterations.bats
          bats tests/bats/launcher.bats
          bats tests/bats/dispatch-detach.bats
          bats tests/bats/hooks.bats
          bats tests/bats/reviewer-harness.bats
          bats tests/bats/clean-verify.bats
          bats tests/bats/graphrag-scope-audit.bats
          bats tests/bats/graphrag-worktree-dispatch.bats
      - name: fan-in rollback tests
        run: python3 -m unittest discover -s tests/python
      - name: run plan-runner bats
        env:
          CODEX_DISPATCH_BIN: ${{ steps.bin.outputs.path }}
        run: bats tests/bats/graphrag-plan-runner.bats
